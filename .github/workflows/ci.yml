name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # core is a build dependency of the CLI and app (consumed via its dist/).
      - run: npm run build -w @divesend/core

      # @divesend/libdivecomputer-wasm's build AND its test compile with emcc,
      # so the Emscripten SDK has to be on PATH before `npm test` and the final
      # `npm run build`. Third-party action; installs latest emsdk.
      - uses: mymindstorm/setup-emsdk@v14

      - run: npm test

      - run: npm run lint -w app

      - run: npm run build
